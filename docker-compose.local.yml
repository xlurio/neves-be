volumes:
  neves_be_local_postgres_data: {}
  neves_be_local_postgres_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: neves_be_local_django
    container_name: neves_be_local_django
    depends_on:
      - postgres
      - rabbitmq

    volumes:
      - ./.env:/app/.env
      - ./audio-cmn:/app/audio-cmn
      - ./config:/app/config
      - ./mcc2lm.db:/app/mcc2lm.db
      - ./neves_be:/app/neves_be
      - ./tests:/app/tests
      - ./translation_model:/app/translation_model
      - ./tts_model:/app/tts_model

    env_file:
      - .env

    ports:
      - "8000:8000"

    command: /start
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery:
    image: neves_be_local_django
    container_name: neves_be_local_celery
    depends_on:
      - postgres
      - rabbitmq

    volumes:
      - ./.env:/app/.env
      - ./audio-cmn:/app/audio-cmn
      - ./config:/app/config
      - ./mcc2lm.db:/app/mcc2lm.db
      - ./neves_be:/app/neves_be
      - ./tests:/app/tests
      - ./translation_model:/app/translation_model
      - ./tts_model:/app/tts_model

    env_file:
      - .env

    command: /startworker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: postgres:18
    container_name: neves_be_local_postgres
    ports:
      - 5434:5432
    volumes:
      - neves_be_local_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "neves-be"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neves-be

  rabbitmq:
    image: rabbitmq:4.3
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
